  gateway:
    build:
      context: ./codesync-gateway
      dockerfile: Dockerfile
    container_name: codesync-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_started
    networks:
      - codesync-network

volumes:
  redis_data:
  rabbitmq_data:

networks:
  codesync-network:
    driver: bridge
