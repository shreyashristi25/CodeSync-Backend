server:
  port: ${COLLAB_SERVICE_PORT:8084}

spring:
  application:
    name: collab-service
  datasource:
    url: ${COLLAB_DB_URL:jdbc:mysql://localhost:3306/collab_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${COLLAB_DB_USERNAME:root}
    password: ${COLLAB_DB_PASSWORD:Shreya@2002}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

codesync:
  collab:
    redis-channel: codesync:collab:events

logging:
  level:
    com.codesync.collab: DEBUG
    org.springframework.messaging: DEBUG

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
