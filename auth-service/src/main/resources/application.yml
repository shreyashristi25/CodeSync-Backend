  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  admin:
    super-email: ${SUPER_ADMIN_EMAIL:admin@codesync.local}
  email:
    from: ${EMAIL_FROM:onboarding@resend.dev}
    base-url: ${FRONTEND_URL:http://localhost:4200}
    api-key: ${RESEND_API_KEY:re_KRT8bePo_Nj2T8FqqNix8bfNESFhXvwow}
  notifications:
    url: ${NOTIFICATION_SERVICE_URL:http://localhost:8080/api/notifications}
  oauth2:
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:4200/oauth-success}
  razorpay:
    key-id: rzp_test_SjHFqJGmWI1Avc
    key-secret: c2ROXKSptXTRwwTY7wpGYvLh
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:your_razorpay_webhook_secret}
    test-mode: false
  subscription:
    free-projects-limit: 5
    free-executions-limit: 50
    free-collaborators-limit: 3
