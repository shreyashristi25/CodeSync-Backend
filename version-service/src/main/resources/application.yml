server:
  port: ${VERSION_SERVICE_PORT:8086}

spring:
  application:
    name: version-service
  datasource:
    url: ${VERSION_DB_URL:jdbc:mysql://localhost:3306/version_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${VERSION_DB_USERNAME:root}
    password: ${VERSION_DB_PASSWORD:Shreya@2002}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

file:
  service:
    url: ${FILE_SERVICE_URL:http://localhost:8083}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
