services:
  - type: keyvalue
    name: codesync-redis
    ipAllowList: []

  - type: pserv
    name: codesync-eureka
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    envVars:
      - fromGroup: codesync-common
      - key: SERVICE_NAME
        value: eureka-server

  - type: pserv
    name: codesync-auth-service
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    envVars:
      - fromGroup: codesync-common
      - fromGroup: codesync-database
      - fromGroup: codesync-secrets
      - key: SERVICE_NAME
        value: auth-service
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: codesync-redis
          property: connectionString
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  - type: pserv
    name: codesync-project-service
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.render
