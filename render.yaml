  - type: web
    name: codesync-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - fromGroup: codesync-common
      - key: SERVICE_NAME
        value: codesync-gateway

envVarGroups:
  - name: codesync-common
    envVars:
      - key: SERVER_PORT
        value: 10000
      - key: EUREKA_SERVER_URL
        value: http://codesync-eureka:10000/eureka/
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: FRONTEND_URL
        sync: false
      - key: OAUTH2_REDIRECT_URI
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false

  - name: codesync-database
    envVars:
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  - name: codesync-rabbitmq
    envVars:
      - key: RABBITMQ_HOST
        sync: false
      - key: RABBITMQ_PORT
        value: 5672
      - key: RABBITMQ_USER
        sync: false
      - key: RABBITMQ_PASS
        sync: false
      - key: SPRING_RABBITMQ_HOST
        sync: false
      - key: SPRING_RABBITMQ_PORT
        value: 5672
      - key: SPRING_RABBITMQ_USERNAME
        sync: false
      - key: SPRING_RABBITMQ_PASSWORD
        sync: false

  - name: codesync-secrets
    envVars:
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION_MS
        value: 3600000
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: APP_RAZORPAY_KEY_ID
        sync: false
      - key: APP_RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE
        value: email,profile
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_ID
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_CLIENT_SECRET
        sync: false
      - key: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_SCOPE
        value: user:email,read:user
